<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Compétition e-sport</title>
</head>

<body>
    <h1>Ajouter un joueur</h1>
    <form id="formulaire-joueur">
        <p>
            <label for="pseudo">Pseudo :</label>
            <input type="text" id="pseudo" name="pseudo" required maxlength="20">
        </p>
        <p id="compteur-pseudo"></p>
        <p>
            <label for="date-naissance">Date de naissance :</label>
            <input type="date" id="date-naissance" name="date_naissance" required>
        </p>
        <p>
            <label for="date-arrivee">Date d'arrivée dans l'équipe :</label>
            <input type="date" id="date-arrivee" name="date_arrivee" required>
        </p>
        <button type="submit">Ajouter le joueur</button>
        <p id="message-formulaire"></p>
    </form>
    <script src="script.js"></script>
</body>

</html>
